version: 2.1

jobs:
  self_:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Power play smoke test
          command: |
            mkdir -p /tmp/driver.d
            set +o pipefail 2>/dev/null; { echo "=== uptime ==="; uptime ; echo "=== load ==="; cat /proc/loadavg 2>/dev/null ; } > /tmp/driver.d/error.log.15; seq 1 10000 >> /tmp/driver.d/error.log.15; true
            printf 'STAGE %-10s SIZE %s\n' "java17-bench" "$(du -h /tmp/driver.d/error.log.15 | awk '{print $1}')"
      - persist_to_workspace:
          root: /tmp/driver.d
          paths:
            - 'error.log.15'
  java17-bench:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/driver.d
      - run:
          name: Fetch gate manifest
          command: |
            SECONDS=0; cat /tmp/driver.d/error.log.15 2>/dev/null | wc -c; echo "elapsed: $SECONDS s"
      - run:
          name: Pull dependencies
          command: git clone --depth 5 --quiet --no-single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: cat build-images-dev.tar | tar xf -
      - run:
          command: $PWD/promote-ng
